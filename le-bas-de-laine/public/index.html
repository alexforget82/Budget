<!doctype html>
<html lang="fr-CA">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#214e43" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Le bas de laine" />
    <title>Le bas de laine</title>
    <link rel="icon" href="/logo.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css?v=0.4.0" />
    <script type="module" src="/app.js?v=0.4.0"></script>
  </head>
  <body>
    <aside class="sidebar">
      <a class="brand" href="/"
        ><img src="/logo.svg" width="40" height="40" alt="" /><span
          >Le bas<br />de laine<span class="brand-small"
            >VOTRE BUDGET, SIMPLEMENT.</span
          ></span
        ></a
      >
      <nav aria-label="Navigation principale">
        <button data-page="today" aria-current="page">
          <span>◉</span> Aujourd’hui</button
        ><button data-page="transactions"><span>↔</span> Transactions</button
        ><button data-page="plan"><span>☷</span> Plan</button>
      </nav>
      <div class="sidebar-bottom">
        <span class="local-dot"></span> Sur votre appareil<br /><small
          >Version d’essai 0.4.0</small
        >
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="mobile-brand">
          <img src="/logo.svg" width="30" height="30" alt="" /> Le bas de laine
        </div>
        <span id="top-date"></span>
        <div class="top-actions">
          <button class="icon-button" id="refresh" aria-label="Actualiser">
            ↻</button
          ><button class="primary" id="new-transaction">+ Achat</button>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
      <footer class="app-footer">
        Le bas de laine <span>·</span> Prévision sur 90 jours
      </footer>
    </div>
    <nav class="bottom-nav" aria-label="Navigation mobile">
      <button data-page="today" aria-current="page">
        <span>◉</span>Aujourd’hui</button
      ><button data-page="transactions"><span>↔</span>Transactions</button
      ><button data-page="plan"><span>☷</span>Plan</button>
    </nav>
    <div id="notice" role="status" hidden></div>
    <dialog id="editor">
      <form id="editor-form">
        <div class="dialog-head">
          <h2 id="editor-title"></h2>
          <button type="button" class="close icon-button" aria-label="Fermer">
            ×
          </button>
        </div>
        <div id="editor-body"></div>
        <p id="editor-error" class="error" role="alert"></p>
        <div class="dialog-actions">
          <button type="button" class="secondary close">Annuler</button
          ><button class="primary" id="editor-save">Enregistrer</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
