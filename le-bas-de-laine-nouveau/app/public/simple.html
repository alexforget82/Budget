<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b3d72">
  <title>Le Bas de Laine — foyer</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="simple simple-wife">
    <header><img src="/logo.svg" alt=""><div class="grow"><h1>Le Bas de Laine <small>Vue du foyer</small></h1></div><button class="icon-button" id="refresh" type="button" aria-label="Actualiser">↻</button></header>
    <article class="simple-hero simple-today"><small>Disponible prévu aujourd’hui</small><b id="safe">—</b><span id="safe-note">Chargement…</span></article>
    <div class="simple-grid simple-overview">
      <article class="card grocery-card"><div class="simple-card-label">Épicerie</div><div class="big" id="grocery">—</div><span id="grocery-note">Aucune limite</span></article>
      <article class="card"><div class="simple-card-label">Minimum 30 jours</div><div class="big" id="safe30">—</div><span id="safe30-note">—</span></article>
    </div>
    <article class="card simple-list simple-today-events"><div class="simple-section-head"><div><h2>Aujourd’hui</h2><p>Opérations saisies et prévues.</p></div><span id="today-date">—</span></div><div id="events"></div></article>
    <article class="card simple-list afford-simple"><div class="simple-section-head"><div><h2>Puis-je faire cet achat ?</h2><p>Le résultat vérifie le minimum des 30 prochains jours.</p></div></div><form id="afford"><label class="field">Montant de l’achat<input name="amount" required inputmode="decimal" placeholder="0,00"></label><button class="primary">Vérifier</button></form><p id="answer" class="notice" hidden></p></article>
  </main>
  <script src="/simple.js"></script>
</body>
</html>
